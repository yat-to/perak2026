<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Badge / Emblem Icon -->
  <g transform="translate(4, 6)">
    <!-- Hexagonal / Shield Background -->
    <path d="M24 0L44 11.5V36.5L24 48L4 36.5V11.5L24 0Z" fill="url(#grad_primary)" />
    <!-- Inner golden border -->
    <path d="M24 3L41 12.8V35.2L24 45L7 35.2V12.8L24 3Z" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>
    
    <!-- Stylized Identification Card & Checkmark -->
    <rect x="13" y="14" width="22" height="15" rx="2" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="16" y="17" width="5" height="5" rx="1" fill="#2563EB"/>
    <line x1="23" y1="18" x2="31" y2="18" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="22" x2="29" y2="22" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="25" x2="31" y2="25" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Dynamic swoosh / growth curve in green -->
    <path d="M12 34C18 31 28 30 36 22" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="22" r="2.5" fill="#10B981"/>
  </g>

  <!-- Typography -->
  <text x="64" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="0.5">
    PERAK
  </text>
  <text x="146" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#2563EB" letter-spacing="0.2">
    KONSEL
  </text>
  <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9" fill="#64748B" letter-spacing="0.3">
    LAYANAN DIGITAL KARTU KUNING (AK-1)
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad_primary" x1="4" y1="0" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F2B5C"/>
    </linearGradient>
  </defs>
</svg>
